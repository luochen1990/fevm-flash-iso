# CI 质量检查: 在 nix develop 环境内运行质量门禁与端到端冒烟
# 质量门禁与本地 `nix develop -c just check` 完全同源, 见 justfile
name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Checkout
        uses: actions/checkout@v4
      - name: "质量门禁 (just check: ruff + mypy --strict + pytest 覆盖率>=85%)"
        run: nix develop -c just check
      - name: "端到端冒烟 (just build-demo: 合成固件包完整 CLI 构建)"
        run: nix develop -c just build-demo
